[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dinner-planner"
version = "0.1.0"
description = "Collaborative planning with a measurable disclosure bound"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.38.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "aius"
display-name = "Bounded Disclosure Planner"
color = "violet"
fab-format-version = 1
flwr-version-target = "1.38.0"
fab-include = ["agent/**/*.py", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
