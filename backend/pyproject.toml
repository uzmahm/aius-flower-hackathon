[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-planner"
version = "0.2.0"
description = "Collaborative event planning with a measurable disclosure bound"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.38.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["event_planner"]

[tool.flwr.app]
publisher = "aius"
display-name = "Event Planner"
color = "violet"
fab-format-version = 1
flwr-version-target = "1.38.0"
fab-include = ["event_planner/**/*.py", "event_planner/users/*.json", "LICENSE"]

[tool.flwr.app.components]
agentapp = "event_planner.agent_app:app"
